<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Iman Al Hindawi</title>
  <meta name="description" content="That page does not exist. Find your way back to Iman Al Hindawi's portfolio." />
  <!-- A wrong address is never worth indexing, whatever the site's own
       visibility setting happens to be. -->
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#fdeff4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <!-- In the head, before the first paint: the hidden start states in
       styles.css only exist while this file is running to undo them. -->
  <script src="/anim.js"></script>
</head>
<body>
  <!-- Permanently light: there is no picture behind this header to sit over. -->
  <header class="site-header static" id="header">
    <nav class="nav" id="nav">
      <a href="/">Home</a>
      <a href="/projects" data-nav-card="0">Projects</a>
      <a href="/entrepreneur" data-nav-card="1">Entrepreneur</a>
      <a href="/iman-lifestyle" data-nav-card="2">Iman Lifestyle</a>
      <a href="/contact">Contact</a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- Not `.page`: that class exists to push a page's first line clear of the
       fixed header, and this section already stands its own screen clear with
       its own top padding. Both together left about 90px of empty scroll under
       a screen that was meant to be exactly one screen. -->
  <main>
    <section class="notfound">
      <!-- Spoken aloud as words: a screen reader reading out "four hundred and
           four" on its own tells nobody what has happened. -->
      <p class="notfound-code" aria-hidden="true" data-anim="up">404</p>
      <h1 class="notfound-title" data-anim="up" data-anim-delay="110">Page Not Found</h1>
      <p class="notfound-sub" data-anim="up" data-anim-delay="200">
        The page you were looking for has moved, or never existed.
      </p>
      <a class="notfound-back" href="/" data-anim="up" data-anim-delay="290">
        <span>Back Home</span>
        <!-- The circled arrow the reference carries, drawn rather than typed so
             it keeps its shape in every font. -->
        <span class="notfound-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="12" x2="19" y2="12" />
            <polyline points="13 6 19 12 13 18" />
          </svg>
        </span>
      </a>
    </section>
  </main>

  <script src="/brand-fonts.js"></script>
  <script src="/social-icons.js"></script>
  <script src="/cursor.js"></script>
  <script src="/analytics.js"></script>
  <script src="/script.js"></script>
</body>
</html>
