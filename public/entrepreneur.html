<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrepreneur | Iman Al Hindawi</title>
  <meta name="description" content="Data analytics and live web projects by Iman Al Hindawi — Power BI dashboards, reporting and insight for decision making." />
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#fdeff4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- In the head, before the first paint: the hidden start states in
       styles.css only exist while this file is running to undo them. -->
  <script src="anim.js"></script>
</head>
<body data-section="entrepreneur">
  <!-- Transparent over the full-bleed picture; the scroll handler gives it a
       background once the visitor scrolls past the image. -->
  <header class="site-header" id="header">
    <!-- No wordmark here: the logo belongs to the home page alone. "Home" in the
         nav is the way back, so nothing is stranded by dropping it. -->
    <nav class="nav" id="nav">
      <a href="/">Home</a>
      <a href="/projects" data-nav-card="0">Projects</a>
      <a href="/entrepreneur" data-nav-card="1" aria-current="page">Entrepreneur</a>
      <a href="/iman-lifestyle" data-nav-card="2">Iman Lifestyle</a>
      <a href="/contact">Contact</a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main>
    <section class="section-hero" id="entrepreneur">
      <div class="section-hero-media" id="entrepreneurMedia"></div>
      <div class="section-hero-inner">
        <div class="section-hero-copy">
          <!-- Named in the nav, as on the reference; the heading stays in the
               page for search and for heading navigation. -->
          <h1 class="visually-hidden" id="entrepreneurTitle">Entrepreneur</h1>
          <!-- Rises into place a beat ahead of the links under it, which follow
               one another, the way the reference brings the copy over its
               picture in. -->
          <p id="entrepreneurBody" data-anim="up"></p>
          <div class="section-links">
            <a href="/contact" class="section-link" id="entrepreneurCta" data-anim="up" data-anim-delay="140"></a>
            <!-- Opens the live sites over the picture; nothing about them sits
                 on the page itself, so this page stays one screen like the
                 others. -->
            <button type="button" class="section-link" id="liveProjectsBtn"
                    data-anim="up" data-anim-delay="230"
                    aria-haspopup="dialog" aria-expanded="false" aria-controls="projectsOverlay">
              Live projects
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- The live sites, opened by the button above rather than shown on the
         page. Managed from the dashboard; the cards below are the fallback the
         markup ships with. -->
    <div class="projects-overlay" id="projectsOverlay" role="dialog" aria-modal="true"
         aria-labelledby="projectsOverlayTitle" hidden>
      <div class="projects-overlay-inner">
        <div class="projects-overlay-head">
          <h2 class="web-live-title" id="projectsOverlayTitle">Live projects</h2>
          <button type="button" class="projects-overlay-close" id="projectsOverlayClose" aria-label="Close">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <div class="projects-grid" id="projectsGrid">
          <a class="project-card" href="https://exam-management-system-kappa.vercel.app/" target="_blank" rel="noopener">
            <span class="project-card-shot" style="background-image:url('assets/uploads/proj-exam.png?v=2')"></span>
            <span class="project-card-foot">
              <span class="project-card-name">Exam System</span>
              <span class="project-card-go">View live project ↗</span>
            </span>
          </a>
          <a class="project-card" href="https://hibas-bakery.vercel.app/" target="_blank" rel="noopener">
            <span class="project-card-shot" style="background-image:url('assets/uploads/proj-bakery.png?v=2')"></span>
            <span class="project-card-foot">
              <span class="project-card-name">Hiba's Bakery</span>
              <span class="project-card-go">View live project ↗</span>
            </span>
          </a>
          <a class="project-card" href="https://makeup-by-ikbal.vercel.app/" target="_blank" rel="noopener">
            <span class="project-card-shot" style="background-image:url('assets/uploads/proj-makeup.png?v=2')"></span>
            <span class="project-card-foot">
              <span class="project-card-name">Makeup by Ikbal</span>
              <span class="project-card-go">View live project ↗</span>
            </span>
          </a>
        </div>
      </div>
    </div>
  </main>


  <script src="brand-fonts.js"></script>
  <script src="social-icons.js"></script>
  <script src="cursor.js"></script>
  <script src="analytics.js"></script>
  <script src="script.js"></script>
</body>
</html>
