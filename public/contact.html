<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Iman Al Hindawi</title>
  <meta name="description" content="Get in touch with Iman Al Hindawi — project coordination, data analytics, or a new website. Based in Beirut, Lebanon." />
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#fdeff4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- In the head, before the first paint: the hidden start states in
       styles.css only exist while this file is running to undo them. -->
  <script src="anim.js"></script>
</head>
<body>
  <header class="site-header static" id="header">
    <!-- No wordmark here: the logo belongs to the home page alone. "Home" in the
         nav is the way back, so nothing is stranded by dropping it. -->
    <nav class="nav" id="nav">
      <a href="/">Home</a>
      <a href="/projects" data-nav-card="0">Projects</a>
      <a href="/entrepreneur" data-nav-card="1">Entrepreneur</a>
      <a href="/iman-lifestyle" data-nav-card="2">Iman Lifestyle</a>
      <a href="/contact" aria-current="page">Contact</a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main class="page">
    <!-- The intro paragraph opens the Project Management page instead. -->
    <section class="contact" id="contact">
      <!-- The block used to arrive as one piece. It now comes in the order it
           is read, on the same rise the section pages use, and the form's own
           rows carry on the count from where the heading left off. -->
      <div>
        <p class="eyebrow light" id="contactEyebrow" data-anim="up"></p>
        <h1 id="contactHeading" data-anim="up" data-anim-delay="80">Let’s work together</h1>
        <p class="contact-sub" id="contactSub" data-anim="up" data-anim-delay="170"></p>

        <form class="contact-form" id="contactForm" novalidate
              data-anim-children="70" data-anim-delay="260">
          <div class="cf-row">
            <input type="text" name="name" id="cfName" placeholder="Your name" required />
            <input type="email" name="email" id="cfEmail" placeholder="Your email" required />
          </div>
          <input type="tel" name="phone" id="cfPhone" class="cf-phone" placeholder="Your phone number" required />
          <textarea name="message" id="cfMessage" rows="5" placeholder="Your message" required></textarea>
          <button type="submit" id="cfSubmit">Send message</button>
          <!-- Left out of the stagger: it is empty until the form has been
               sent, so it has no height to be noticed by and would still be
               hidden at the one moment it matters. -->
          <p class="cf-status" id="cfStatus" role="status" data-anim-skip></p>
        </form>
      </div>
    </section>

    <!-- In place of the footer: the same circled icons as the home page, built
         from the socials and the address under Settings → Contact info. The
         icons are drawn from the dashboard's content, so the stagger is asked
         for on the row and handed out to whatever ends up inside it. -->
    <nav class="social-circles" id="socialCircles" aria-label="Contact and social links"
         data-anim-children="80"></nav>
  </main>

  <script src="brand-fonts.js"></script>
  <script src="social-icons.js"></script>
  <script src="cursor.js"></script>
  <script src="analytics.js"></script>
  <script src="script.js"></script>
</body>
</html>
