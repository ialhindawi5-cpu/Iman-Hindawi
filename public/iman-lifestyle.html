<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iman Lifestyle — Iman Al Hindawi</title>
  <meta name="description" content="Iman Lifestyle — a personal page by Iman Al Hindawi, Project Coordinator and Data Analyst in Beirut." />
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#fdeff4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- In the head, before the first paint: the hidden start states in
       styles.css only exist while this file is running to undo them. -->
  <script src="anim.js"></script>
</head>
<body data-section="philanthropist">
  <!-- Transparent over the full-bleed picture; the scroll handler gives it a
       background once the visitor scrolls past the image. -->
  <header class="site-header" id="header">
    <!-- No wordmark here: the logo belongs to the home page alone. "Home" in the
         nav is the way back, so nothing is stranded by dropping it. -->
    <nav class="nav" id="nav">
      <a href="/">Home</a>
      <a href="/projects" data-nav-card="0">Projects</a>
      <a href="/entrepreneur" data-nav-card="1">Entrepreneur</a>
      <a href="/iman-lifestyle" data-nav-card="2" aria-current="page">Iman Lifestyle</a>
      <a href="/contact">Contact</a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main>
    <section class="section-hero" id="lifestyle">
      <div class="section-hero-media" id="philanthropistMedia"></div>
      <div class="section-hero-inner">
        <div class="section-hero-copy">
          <!-- Named in the nav, as on the reference; the heading stays in the
               page for search and for heading navigation. -->
          <h1 class="visually-hidden" id="philanthropistTitle">Iman Lifestyle</h1>
          <!-- Rises into place a beat ahead of the link under it, the way the
               reference brings the copy over its picture in. -->
          <p id="philanthropistBody" data-anim="up"></p>
          <!-- One button, as on the other two pages. Its words and where it goes
               are both set in the dashboard; the href here is the fallback. -->
          <div class="section-links">
            <a href="/contact" class="section-link" id="philanthropistCta" data-anim="up" data-anim-delay="140"></a>
          </div>
        </div>
      </div>
    </section>
  </main>


  <script src="brand-fonts.js"></script>
  <script src="social-icons.js"></script>
  <script src="cursor.js"></script>
  <script src="analytics.js"></script>
  <script src="script.js"></script>
</body>
</html>
